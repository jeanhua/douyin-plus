name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 读取仓库内容用默认权限，创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 无第三方依赖，不需要 npm ci
      - name: 运行自测
        run: npm test

      - name: 校验 manifest 与 package.json
        run: node tools/check-manifest.js

      # 打 tag 时校验 tag 与 manifest 版本一致，避免发出名字对不上的包
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 manifest.json 的版本 $MANIFEST_VERSION 不一致"
            exit 1
          fi

      - name: 打包
        run: node tools/pack.js

      - name: 展示产物
        run: ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: douyin-plus-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      # 打 tag 时发布 Release，把 zip 作为附件
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
